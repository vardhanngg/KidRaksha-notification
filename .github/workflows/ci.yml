name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, stage-10-final-release]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            services/api/package.json
            apps/web/package.json
      - name: Install API dependencies
        working-directory: services/api
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Install web dependencies
        working-directory: apps/web
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Product checks
        run: |
          bash scripts/check-product.sh
          bash scripts/check-web-ui.sh
          bash scripts/check-realtime.sh
          bash scripts/check-security.sh
          bash scripts/check-ops.sh
          bash scripts/check-release.sh
      - name: API tests
        working-directory: services/api
        run: npm test
      - name: Web typecheck
        working-directory: apps/web
        run: npm run typecheck
      - name: Web production build
        working-directory: apps/web
        run: npm run build
      - name: Compose configuration validation
        env:
          POSTGRES_PASSWORD: ci-postgres-password-123456789012345
          DOMAIN: ci.example.com
          DATA_ENCRYPTION_KEY: MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMA==
          PAIRING_CODE_SECRET: ci-pairing-secret-abcdefghijklmnopqrstuvwxyz
          RAZORPAY_WEBHOOK_SECRET: ci-webhook-secret-123456
          REDIS_PASSWORD: ci-redis-password-123456789012345
          SMTP_HOST: smtp.ci.invalid
          SMTP_PORT: "587"
          SMTP_SECURE: "false"
          SMTP_REQUIRE_TLS: "true"
          SMTP_USER: ci-smtp-user
          SMTP_PASS: ci-smtp-password
          SMTP_FROM: ci@example.com
          TLS_DIR: /tmp/kidraksha-tls
          IMAGE_TAG: ci
        run: |
          mkdir -p /tmp/kidraksha-tls
          printf 'placeholder' > /tmp/kidraksha-tls/fullchain.pem
          printf 'placeholder' > /tmp/kidraksha-tls/privkey.pem
          docker compose -f infra/docker-compose.yml config >/dev/null
          docker compose -f infra/docker-compose.production.yml config >/dev/null
      - name: Node syntax checks
        run: |
          node --check services/api/src/server.js
          node --check services/api/src/auth.js
          node --check services/api/src/billing.js
          node --check services/api/src/crypto.js
          node --check services/api/src/db.js
          node --check services/api/src/entitlements.js
          node --check services/api/src/events.js
          node --check services/api/src/logger.js
          node --check services/api/src/pagination.js
          node --check services/api/src/rate-limit.js
          node --check services/api/scripts/migrate.js
          node --check services/api/scripts/maintenance.js

  docker:
    runs-on: ubuntu-latest
    needs: [static]
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v6
      - name: Build API image
        run: docker build --file services/api/Dockerfile --tag kidraksha-api:ci services/api
      - name: Build web image
        run: docker build --build-arg PUBLIC_WEB_ORIGIN=https://ci.invalid --file apps/web/Dockerfile --tag kidraksha-web:ci apps/web
