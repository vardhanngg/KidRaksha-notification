services:
  postgres:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_DB: kidraksha
      POSTGRES_USER: kidraksha
      POSTGRES_PASSWORD: kidraksha_dev_only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - kid_suraksha_dev_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kidraksha -d kidraksha"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8.10.2-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  kid_suraksha_dev_pgdata:
