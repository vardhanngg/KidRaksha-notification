
services:
  redis:
    image: redis:8.10.2-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: kidraksha
      POSTGRES_USER: kidraksha
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../services/api/db/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kidraksha -d kidraksha"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: ../services/api
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgres://kidraksha:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/kidraksha
      PUBLIC_WEB_ORIGIN: https://${DOMAIN:?Set DOMAIN}
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:?Set DATA_ENCRYPTION_KEY}
      PAIRING_CODE_SECRET: ${PAIRING_CODE_SECRET:?Set PAIRING_CODE_SECRET}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:?Set RAZORPAY_WEBHOOK_SECRET}
      RAZORPAY_PLAN_STARTER: ${RAZORPAY_PLAN_STARTER:-}
      RAZORPAY_PLAN_FAMILY: ${RAZORPAY_PLAN_FAMILY:-}
      REDIS_URL: redis://redis:6379
      DATA_ENCRYPTION_KEY_PREVIOUS: ${DATA_ENCRYPTION_KEY_PREVIOUS:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "4000"

  web:
    build: ../apps/web
    environment:
      API_INTERNAL_ORIGIN: http://api:4000
    depends_on:
      - api
    expose:
      - "3000"

  nginx:
    image: nginx:1.29-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web
      - api

volumes:
  pgdata:
  redisdata:
