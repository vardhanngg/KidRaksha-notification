
plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
}

def configuredApiUrl = project.findProperty("LITTLEWATCH_API_URL")
def releaseApiUrl = configuredApiUrl ?: "https://api.example.com"
def debugApiUrl = configuredApiUrl ?: "http://10.0.2.2:4000"

android {
    namespace "com.littlewatch.child"
    compileSdk 36

    defaultConfig {
        applicationId "com.littlewatch.child"
        minSdk 28
        targetSdk 36
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
            buildConfigField "String", "API_BASE_URL", "\"${releaseApiUrl.replace("\\", "\\\\").replace("\"", "\\\"")}\""
        }
        debug {
            minifyEnabled false
            buildConfigField "String", "API_BASE_URL", "\"${debugApiUrl.replace("\\", "\\\\").replace("\"", "\\\"")}\""
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions { jvmTarget = "17" }

    buildFeatures { buildConfig = true }
}

dependencies {
}
