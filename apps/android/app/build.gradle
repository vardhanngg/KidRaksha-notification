plugins {
    id 'com.android.application'
}

def configuredApiUrl = project.findProperty("KIDSURAKSHA_API_URL") ?: System.getenv("KIDSURAKSHA_API_URL")
def configuredVersionCode = (project.findProperty("KIDSURAKSHA_VERSION_CODE") ?: System.getenv("KIDSURAKSHA_VERSION_CODE") ?: "5").toString()
def configuredVersionName = (project.findProperty("KIDSURAKSHA_VERSION_NAME") ?: System.getenv("KIDSURAKSHA_VERSION_NAME") ?: "1.4.0").toString()
def releaseKeystorePath = project.findProperty("KIDSURAKSHA_RELEASE_KEYSTORE") ?: System.getenv("KIDSURAKSHA_RELEASE_KEYSTORE")
def releaseStorePassword = project.findProperty("KIDSURAKSHA_RELEASE_STORE_PASSWORD") ?: System.getenv("KIDSURAKSHA_RELEASE_STORE_PASSWORD")
def releaseKeyAlias = project.findProperty("KIDSURAKSHA_RELEASE_KEY_ALIAS") ?: System.getenv("KIDSURAKSHA_RELEASE_KEY_ALIAS")
def releaseKeyPassword = project.findProperty("KIDSURAKSHA_RELEASE_KEY_PASSWORD") ?: System.getenv("KIDSURAKSHA_RELEASE_KEY_PASSWORD")
def requireReleaseSigning = (project.findProperty("KIDSURAKSHA_REQUIRE_SIGNING") ?: System.getenv("KIDSURAKSHA_REQUIRE_SIGNING") ?: "false").toString().toBoolean()
def hasReleaseSigning = [releaseKeystorePath, releaseStorePassword, releaseKeyAlias, releaseKeyPassword].every { it }
if (!configuredVersionCode.isInteger()) throw new GradleException("KIDSURAKSHA_VERSION_CODE must be an integer")
def releaseApiUrl = configuredApiUrl ?: ""
def debugApiUrl = configuredApiUrl ?: "http://10.0.2.2:4000"
if (releaseApiUrl && !releaseApiUrl.startsWith("https://")) throw new GradleException("KIDSURAKSHA_API_URL must use HTTPS for release builds")

if (!releaseApiUrl) {
    tasks.register("validateReleaseApiUrl") {
        doLast { throw new GradleException("KIDSURAKSHA_API_URL is required for release builds") }
    }
}

android {
    namespace "com.kidsuraksha.child"
    compileSdk 36

    defaultConfig {
        applicationId "com.kidsuraksha.child"
        minSdk 28
        targetSdk 36
        versionCode Integer.parseInt(configuredVersionCode)
        versionName configuredVersionName
    }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(releaseKeystorePath)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            if (hasReleaseSigning) { signingConfig signingConfigs.release }
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
            buildConfigField "String", "API_BASE_URL", "\"${releaseApiUrl.replace("\\", "\\\\").replace("\"", "\\\"")}\""
        }
        debug {
            minifyEnabled false
            buildConfigField "String", "API_BASE_URL", "\"${debugApiUrl.replace("\\", "\\\\").replace("\"", "\\\"")}\""
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

    buildFeatures { buildConfig = true }
}

dependencies {
    implementation "androidx.work:work-runtime-ktx:2.12.0"
    implementation "androidx.core:core-splashscreen:1.2.0"
    testImplementation "junit:junit:4.13.2"
}

if (!releaseApiUrl) {
    tasks.matching { it.name == "preReleaseBuild" }.configureEach { dependsOn("validateReleaseApiUrl") }
}

tasks.register("validateReleaseSigning") {
    doLast {
        if (!hasReleaseSigning) {
            throw new GradleException("Release signing is required. Set KIDSURAKSHA_RELEASE_KEYSTORE, KIDSURAKSHA_RELEASE_STORE_PASSWORD, KIDSURAKSHA_RELEASE_KEY_ALIAS and KIDSURAKSHA_RELEASE_KEY_PASSWORD.")
        }
        if (!file(releaseKeystorePath).isFile()) {
            throw new GradleException("Release keystore does not exist: ${releaseKeystorePath}")
        }
    }
}

if (requireReleaseSigning) {
    tasks.matching { it.name in ["assembleRelease", "bundleRelease", "packageRelease"] }.configureEach { dependsOn("validateReleaseSigning") }
}
