
plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
}

def configuredApiUrl = project.findProperty("KIDRAKSHA_API_URL") ?: System.getenv("KIDRAKSHA_API_URL")
def releaseApiUrl = configuredApiUrl ?: ""
def debugApiUrl = configuredApiUrl ?: "http://10.0.2.2:4000"

if (!releaseApiUrl) {
    tasks.register("validateReleaseApiUrl") {
        doLast { throw new GradleException("KIDRAKSHA_API_URL is required for release builds") }
    }
}

android {
    namespace "com.kidraksha.child"
    compileSdk 36

    defaultConfig {
        applicationId "com.kidraksha.child"
        minSdk 28
        targetSdk 36
        versionCode 4
        versionName "1.3.0"
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
            buildConfigField "String", "API_BASE_URL", "\"${releaseApiUrl.replace("\\", "\\\\").replace("\"", "\\\"")}\""
        }
        debug {
            minifyEnabled false
            buildConfigField "String", "API_BASE_URL", "\"${debugApiUrl.replace("\\", "\\\\").replace("\"", "\\\"")}\""
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions { jvmTarget = "17" }

    buildFeatures { buildConfig = true }
}

dependencies {
    implementation "androidx.work:work-runtime-ktx:2.12.0"
    testImplementation "junit:junit:4.13.2"
}

if (!releaseApiUrl) {
    tasks.matching { it.name == "preReleaseBuild" }.configureEach { dependsOn("validateReleaseApiUrl") }
}
